# Refresh the queue figures shown by the management API every second, so the live dashboard
# sees the queue grow and drain smoothly.
#
# collect_statistics_interval alone is not enough: the management plugin also samples its
# figures, every 5 s by default. The 3 retention policies below keep RabbitMQ's defaults except
# for a 1 s sample over the last minute. All 3 (global, basic, detailed) must be set together,
# or RabbitMQ fails to start with "missing_sample_retention_policies".
collect_statistics_interval = 1000
management.sample_retention_policies.global.minute = 1
management.sample_retention_policies.global.hour = 60
management.sample_retention_policies.global.day = 1200
management.sample_retention_policies.basic.minute = 1
management.sample_retention_policies.basic.hour = 60
management.sample_retention_policies.detailed.10 = 5
